name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexora"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nexora?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CLIENT_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security regression checks
        run: npm run test:security
      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma
      - name: Bootstrap core Prisma schema
        run: npx prisma db push --skip-generate --schema packages/database/prisma/schema.prisma
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -h localhost -U postgres -d nexora -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
      - name: Apply idempotent operational SQL
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            packages/database/prisma/migrations/20260907183000_support_tickets/migration.sql \
            packages/database/prisma/migrations/20260907183000_campus_management/migration.sql \
            packages/database/prisma/migrations/20260907194500_fee_recovery_batches/migration.sql \
            packages/database/prisma/migrations/20260907195500_fee_invoices/migration.sql \
            packages/database/prisma/migrations/20260907203000_refresh_sessions/migration.sql \
            packages/database/prisma/migrations/20260907_academic_terms/migration.sql \
            packages/database/prisma/migrations/20260907_fee_installments_adjustments/migration.sql \
            packages/database/prisma/migrations/20260907_school_calendar/migration.sql \
            packages/database/prisma/migrations/20260907_storage_objects/migration.sql \
            packages/database/prisma/migrations/20260909113000_people_profiles/migration.sql \
            packages/database/prisma/migrations/20260907210000_fee_constraints_forward_fix/migration.sql \
            packages/database/prisma/migrations/20260909113500_lock_down_backend_tables/migration.sql
          do
            npx prisma db execute --schema packages/database/prisma/schema.prisma --file "$migration"
          done
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build database package
        run: npm run build -w @nexora/database
      - name: Lifecycle behavior tests
        run: npm run test:lifecycle -w @nexora/api
      - name: Multi-tenant isolation tests
        run: npm run test:tenant
      - name: Auth session integration tests
        run: npm run test:auth
      - name: Storage ACL integration tests
        run: npm run test:storage
      - name: Fee integrity integration tests
        run: npm run test:fees
      - name: Attendance approved-leave integration tests
        run: npm run test:attendance
      - name: Approval engine integration tests
        run: npm run test:approvals
      - name: Exam flow and import integration tests
        run: npm run test:exams
      - name: Parent and Student permission integration tests
        run: npm run test:portal
      - name: Support integration tests
        run: npm run test:support
      - name: Super Admin impersonation integration tests
        run: npm run test:impersonation
      - name: Backup validation and restore-plan integration tests
        run: npm run test:backups
      - name: Production runtime security integration tests
        run: npm run test:production
      - name: Build API
        run: npm run build -w @nexora/api
      - name: Build web
        run: npm run build -w @nexora/web
