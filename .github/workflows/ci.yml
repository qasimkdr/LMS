name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexora"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nexora?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security regression checks
        run: npm run test:security
      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma
      - name: Bootstrap core Prisma schema
        run: npx prisma db push --skip-generate --schema packages/database/prisma/schema.prisma
      - name: Replay operational SQL migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            npx prisma db execute --schema packages/database/prisma/schema.prisma --file "${migration}"
          done < <(find packages/database/prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | sort)
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build database package
        run: npm run build -w @nexora/database
      - name: Build API
        run: npm run build -w @nexora/api
      - name: Build web
        run: npm run build -w @nexora/web
