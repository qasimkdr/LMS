services:
  - type: web
    name: nexora-lms-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run db:generate && npm run build -w @nexora/database && npm run build -w @nexora/api
    startCommand: npm run start -w @nexora/api
    healthCheckPath: /api/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: nexora-lms-web
    runtime: static
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build -w @nexora/web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
